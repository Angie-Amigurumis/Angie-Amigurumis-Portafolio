name: Actualizar Catalogo Airtable

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # boton para actualizar

jobs:
  actualizar-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar script para descargar datos 
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node fetch_data.js

      - name: Guardar el nuevo data.json en el repositorio
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Actualizando catálogo desde Airtable" || exit 0
          git push