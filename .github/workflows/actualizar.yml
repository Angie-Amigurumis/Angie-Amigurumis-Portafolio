name: Actualizar Catalogo Airtable

on:
  schedule:
    - cron: '0 0 * * *' # Automático: todos los días a medianoche
  workflow_dispatch: # Manual: te pone un botón en GitHub para actualizar cuando quieras

jobs:
  actualizar-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar script para descargar datos de Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node fetch_data.js

      - name: Guardar el nuevo data.json en el repositorio
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Actualizando catálogo desde Airtable" || exit 0
          git push